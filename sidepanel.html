<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coursera Toolkit</title>
    <link rel="stylesheet" href="./src/panel/panel.css" />
  </head>
  <body>
    <div class="header">
      <div>
        <h1>Coursera Toolkit</h1>
        <p>Công cụ hỗ trợ học tập — điều khiển tab Coursera đang mở</p>
      </div>
    </div>
    <div class="body">
      <div class="section">
        <h2>Chức năng</h2>
        <p class="group-label">Học tập</p>
        <button class="btn" data-action="skip-video-reading">⏩ Bỏ qua video / reading</button>
        <button class="btn" data-action="skip-discussing">💬 Làm discussion</button>
        <p class="group-label">Assignment</p>
        <button class="btn primary" data-action="submit-text-assignment">🤖 Fill assignment (Gemini)</button>
        <button class="btn" data-action="submit-assignment">📤 Nộp bài peer (tự động)</button>
        <button class="btn" data-action="request-grading-by-peer">🎓 Xin chấm lại bằng peer</button>
        <button class="btn" data-action="review-peers">📝 Chấm bài peer (tự động)</button>
        <p class="group-label">Quiz</p>
        <button class="btn" data-action="auto-quiz">❓ Trả lời quiz (Gemini)</button>
        <label class="check"><input type="checkbox" id="p-auto-submit-quiz" /> Tự nộp quiz (tắt = chỉ điền)</label>
      </div>
      <div class="section">
        <h2>Tiến trình</h2>
        <p class="empty" id="p-steps-empty">Chưa có tác vụ nào chạy.</p>
        <ul class="steps" id="p-steps"></ul>
      </div>
      <div class="section">
        <h2>Nhật ký <button id="p-clear-log" type="button">Xoá log</button></h2>
        <div class="log" id="p-log"></div>
      </div>
      <div class="section">
        <h2>Cài đặt Gemini</h2>
        <label class="field" for="p-key">Gemini API key</label>
        <input class="text" id="p-key" type="text" placeholder="Dán API key vào đây" autocomplete="off" />
        <label class="field" for="p-model">Model</label>
        <input class="text" id="p-model" type="text" autocomplete="off" />
        <label class="check"><input type="checkbox" id="p-retry" /> Tự retry khi Gemini rate limit (429)</label>
        <div class="save-row">
          <button class="save" id="p-save" type="button">Lưu cài đặt</button>
          <span class="save-status" id="p-save-status"></span>
        </div>
      </div>
    </div>
    <div class="footer"><span class="dot" id="p-dot"></span><span id="p-status">Sẵn sàng.</span></div>
    <script type="module" src="./src/panel/panel.ts"></script>
  </body>
</html>
